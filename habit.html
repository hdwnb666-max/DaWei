<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 没有这行，手机浏览器会按桌面宽度（约 980px）渲染再整体缩小，整页又小又糊 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<!-- 加到主屏幕后全屏打开（安卓看 manifest，iOS 看这两个 apple- 的） -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="每日坚持">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<title>每日坚持日历</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23121212'/><rect x='20' y='26' width='60' height='54' rx='8' fill='none' stroke='%237fa8dc' stroke-width='8'/><circle cx='38' cy='60' r='7' fill='%23256b4d'/><circle cx='62' cy='60' r='7' fill='%238f3a37'/></svg>">

<style>
/* ============================================================
   每日坚持日历 —— 样式
   刻意只做暗色主题（用户要求默认暗色），所有颜色显式写死，
   不依赖 prefers-color-scheme，避免在半明半暗环境下出现半吊子效果。
   字体全部用系统自带，不引外部字体（引外部中文字体会让首屏慢十几倍）。
   ============================================================ */
:root{
  --bg:#121212;
  --card:#1e1e1e;
  --card-2:#262626;
  --line:#2e2e2e;
  --text:#f2f3f4;
  --text-2:#9aa3ab;
  --text-3:#a0a7ad;
  --green:#256b4d;      /* 全绿 */
  --yellow:#7a6420;     /* 部分完成 */
  --red:#8f3a37;        /* 未完成负向习惯 */
  --accent:#7fa8dc;     /* 主色：按钮、今天描边 */
  --leaf:#6fbf8f;       /* 树的颜色，跟树图里的绿对齐 */
  --accent-dim:#22303f;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  /* 全屏打开时躲开 iPhone 底部的横条 */
  padding-bottom:calc(3rem + env(safe-area-inset-bottom,0px));
}
body.locked{overflow:hidden}

/* 左右和顶部同理：全屏（加到主屏）时躲开刘海和圆角 */
.app{
  max-width:520px;margin:0 auto;
  padding:max(1rem,env(safe-area-inset-top,0px))
          max(1rem,env(safe-area-inset-right,0px))
          0
          max(1rem,env(safe-area-inset-left,0px));
}

/* ---------------- 顶部 ---------------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
h1{font-size:1.18rem;font-weight:600;margin:0;letter-spacing:.01em}
.back{
  display:inline-block;margin-top:.15rem;
  font-size:.76rem;color:var(--text-3);text-decoration:none;
}
.back:hover{color:var(--accent)}

/* 视图切换：日历 / 统计 */
.views{
  display:flex;gap:.28rem;margin-top:.95rem;padding:.22rem;
  background:var(--card);border:1px solid var(--line);border-radius:99px;
}
.views button{
  flex:1;font:inherit;font-size:.78rem;padding:.36rem .5rem;
  background:transparent;border:0;border-radius:99px;color:var(--text-2);cursor:pointer;
}
.views button:hover{color:var(--text)}
.views button[aria-selected="true"]{background:var(--accent-dim);color:var(--text);font-weight:600}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 颜色风格：换树的色 + 换页面主色。树是位图，靠滤镜换，不重新出图 */
.skins{
  display:flex;gap:.55rem;justify-content:center;align-items:center;
  margin-top:.7rem;
}
.skins button{
  width:22px;height:22px;padding:0;border-radius:50%;cursor:pointer;
  border:2px solid transparent;background:transparent;
  display:grid;place-items:center;
}
.skins button i{
  display:block;width:14px;height:14px;border-radius:50%;
  background:var(--sw,#6fbf8f);
}
.skins button:hover{border-color:var(--line)}
.skins button[aria-pressed="true"]{border-color:var(--text-2)}
.skins button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.io{display:flex;gap:.4rem;padding-top:.15rem}
.io button{
  font:inherit;font-size:.76rem;color:var(--text-2);
  background:transparent;border:1px solid var(--line);border-radius:99px;
  padding:.2rem .7rem;cursor:pointer;
}
.io button:hover{color:var(--accent);border-color:var(--accent)}

/* ---------------- 今日条 ---------------- */
/* 存在的理由：点开这个页面时「今天记了没」应该是第一眼信息，
   而不是让人去月历里找今天那一格。 */
.today-bar{
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
  margin-top:1rem;padding:.7rem .85rem;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
}
.today-bar .tb-main{flex:1;min-width:9rem}
.today-bar .tb-title{font-size:.88rem;font-weight:600}
.today-bar .tb-sub{font-size:.72rem;color:var(--text-3);margin-top:.1rem}
.today-bar .tb-sub .ok{color:#7fc9a3}
.today-bar .tb-sub .warn{color:#e0b06a}
.today-bar .tb-sub .bad{color:#e08b88}
.today-bar .tb-sub .skip{color:var(--text-2)}
.today-bar .tb-dot{
  width:9px;height:9px;border-radius:50%;flex:none;
  background:var(--card-2);border:1px solid var(--line);
}
.today-bar.s-done   .tb-dot{background:var(--green);border-color:var(--green)}
.today-bar.s-partial .tb-dot{background:var(--yellow);border-color:var(--yellow)}
.today-bar.s-fail   .tb-dot{background:var(--red);border-color:var(--red)}
/* 休息跳过用虚线灰点：跳过既不是成功也不是失败，不给红黄绿 */
.today-bar.s-skip   .tb-dot{background:var(--card-2);border:1px dashed var(--text-3)}

/* ---------------- 连续天数（跟在月历图例下面） ---------------- */
.stats{
  display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;
  margin-top:1.2rem;
}
.stats h2{grid-column:1/-1;font-size:.8rem;font-weight:600;margin:0 0 .1rem}
.stat{
  background:var(--card-2);border-radius:8px;padding:.6rem .3rem;
  display:flex;flex-direction:column;align-items:center;gap:.1rem;
  text-align:center;
}
/* 可点的卡片（连续天数）：给一点「这是入口」的暗示，但不抢主色 */
.stat.tapable{cursor:pointer;border:1px solid transparent;transition:border-color .12s,background .12s}
.stat.tapable:hover{border-color:var(--accent);background:#303030}
.stat.tapable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat .v{font-family:var(--mono);font-size:1.25rem;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.stat .k{font-size:.68rem;color:#c9d1d9;letter-spacing:.02em}
.stat .flame{font-size:.68em;margin-right:.18rem;vertical-align:.08em;font-family:var(--sans)}

/* ---------------- 月历 ---------------- */
.cal{margin-top:1.4rem}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}
.cal-head h2{font-size:1rem;font-weight:600;margin:0;font-variant-numeric:tabular-nums}
.nav{
  font:inherit;font-size:1.1rem;line-height:1;
  width:34px;height:34px;border-radius:8px;
  color:var(--text-2);background:var(--card);border:1px solid var(--line);
  cursor:pointer;
}
.nav:hover{color:var(--accent);border-color:var(--accent)}

.weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
  margin-bottom:4px;
}
.weekdays span{
  text-align:center;font-size:.7rem;color:var(--text-3);letter-spacing:.05em;
}
.weekdays span:nth-child(6),
.weekdays span:nth-child(7){color:#8a7a5e}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}

.cell{
  position:relative;aspect-ratio:1/1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border-radius:8px;border:1px solid transparent;
  background:var(--card);color:var(--text-2);
  font:inherit;font-size:.92rem;font-variant-numeric:tabular-nums;
  cursor:pointer;padding:2px;
  transition:transform .1s, border-color .12s;
}
.cell:hover{transform:translateY(-1px)}
.cell.blank{background:transparent;border:0;pointer-events:none}
.cell.done{background:var(--green);color:#fff}
.cell.partial{background:var(--yellow);color:#fff}
.cell.fail{background:var(--red);color:#fff}
.cell.skip{background:repeating-linear-gradient(135deg,var(--card-2),var(--card-2) 5px,var(--line) 5px,var(--line) 7px);color:var(--text-2)}
/* 今天用描边标，不用背景色 —— 否则会跟完成状态的颜色打架 */
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
/* 未来的日子：不该点、也不该看着像「漏记」 */
.cell.future{opacity:.35;cursor:default}
.cell.future:hover{transform:none}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dots{display:flex;gap:2.5px;height:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.25}
.dots i.on{opacity:1}

/* ---------------- 图例 ---------------- */
.legend{
  display:flex;gap:.9rem;flex-wrap:wrap;justify-content:center;
  margin-top:1rem;font-size:.72rem;color:var(--text-3);
}
.legend span{display:inline-flex;align-items:center;gap:.32rem}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.g{background:var(--green)}
.legend i.y{background:var(--yellow)}
.legend i.r{background:var(--red)}
.legend i.s{background:var(--card-2);border:1px dashed var(--text-3)}
.legend i.n{background:var(--card);border:1px solid var(--line)}

/* ---------------- 月度总结 ---------------- */
.monthly{
  margin-top:1.4rem;background:var(--card);border-radius:10px;
  padding:.9rem .9rem .7rem;border:1px solid var(--line);
}
.monthly h2{font-size:.86rem;font-weight:600;margin:0 0 .7rem}
.tally{display:flex;gap:.4rem;margin-bottom:.9rem;flex-wrap:wrap}
.tally div{
  flex:1;min-width:4.6rem;text-align:center;
  background:var(--bg);border-radius:8px;padding:.5rem .2rem;
}
.tally .tv{font-family:var(--mono);font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.tally .tk{font-size:.66rem;color:var(--text-3)}
.tally .t-done  .tv{color:#7fc9a3}
.tally .t-fail  .tv{color:#e08b88}
.tally .t-miss  .tv{color:var(--text-2)}

.hb-row{display:flex;align-items:center;gap:.5rem;padding:.3rem 0;font-size:.78rem}
.hb-name{width:5.2rem;flex:none;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-bar{flex:1;height:7px;border-radius:99px;background:var(--bg);overflow:hidden}
.hb-bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.hb-bar i.low{background:var(--yellow)}
.hb-bar i.zero{background:var(--red);opacity:.7}
.hb-val{font-family:var(--mono);font-size:.72rem;color:var(--text-2);width:4.6rem;text-align:right;flex:none}
.monthly .none-yet{font-size:.76rem;color:var(--text-3);margin:.4rem 0 0}
.trend{margin-top:.8rem;padding:.75rem .9rem;border-top:1px solid var(--line)}
.trend h2{font-size:.8rem;font-weight:600;margin:0 0 .45rem}
.trend p{font-size:.74rem;color:var(--text-3);margin:.35rem 0}
.trend-list{display:flex;gap:.4rem;overflow-x:auto}
.trend-item{min-width:7rem;font-size:.68rem;color:var(--text-3)}
.trend-item strong{display:block;color:var(--text);font-family:var(--mono);font-size:.85rem}

/* ---------------- 树 ---------------- */
.grove{margin-top:.8rem;padding:.75rem .9rem 0;border-top:1px solid var(--line)}
.grove-head{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem}
.grove h2{font-size:.8rem;font-weight:600;margin:0}
.grove-cycle{font-size:.72rem;color:var(--text-2);font-family:var(--mono)}
.grove-art{
  width:100%;max-width:250px;margin:.6rem auto 0;aspect-ratio:1;
  background:#0e0e0e;border-radius:10px;overflow:hidden;
}
/* 缩放的支点是「树根」那一条线（画布 320 高，树根在 304 → 95%）。
   树根不动、树往上长，这样才对。 */
.grove-art img{
  width:100%;height:100%;object-fit:contain;display:block;
  transform-origin:50% 95%;
  filter:var(--tree-filter,none);
}
/* ⚠️ 这两个动效只能动 opacity，不能动 transform ——
   行内 style 里已经有一个 transform（每天的生长缩放），
   keyframes 里再写 transform 会把它整个盖掉。 */
.grove-art img.grew{animation:sprout .45s ease}
.grove-art img.shrank{animation:wither .45s ease}
@keyframes sprout{from{opacity:.5}to{opacity:1}}
@keyframes wither{from{opacity:.7}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .grove-art img.grew,.grove-art img.shrank{animation:none}
  .grove-bar i{transition:none}
}
.grove-meta{display:flex;align-items:baseline;justify-content:space-between;margin-top:.55rem}
.gm-name{font-size:.76rem;color:var(--leaf)}
.gm-day{font-family:var(--mono);font-size:1.15rem;font-weight:600;font-variant-numeric:tabular-nums}
.gm-day small{font-size:.72rem;color:var(--text-2);font-weight:400}
.grove-bar{height:7px;border-radius:99px;background:#0e0e0e;margin-top:.45rem;overflow:hidden}
.grove-bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .4s ease}
.grove-wall{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem;margin-top:.9rem}
.gw-slot{aspect-ratio:1;border-radius:7px;background:#0e0e0e;border:1px solid var(--line);overflow:hidden}
.gw-slot.empty{background:transparent;border-style:dashed;opacity:.5}
/* 先套整体风格，再叠这一格自己的微调 —— 顺序不能反 */
.gw-slot img{
  width:100%;height:100%;object-fit:contain;display:block;
  filter:var(--tree-filter,none)
         hue-rotate(var(--tw,0deg)) saturate(var(--ts,1)) brightness(var(--tb,1));
}
.grove-note{font-size:.72rem;color:var(--text-2);margin:.7rem 0 0;line-height:1.6}

/* ---------------- 起飞记录 ---------------- */
/* 目的是攒出一份「扳机清单」——所以原因用正文色，最显眼 */
.relapses{margin-top:.8rem;padding:.75rem .9rem 0;border-top:1px solid var(--line)}
.relapses h2{font-size:.8rem;font-weight:600;margin:0 0 .3rem}
.relapses .rl-count{font-size:.72rem;color:var(--text-2);margin:0 0 .5rem}
.rl-item{padding:.6rem 0;border-bottom:1px solid var(--line)}
.rl-item:last-child{border-bottom:0}
.rl-head{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap}
.rl-date{font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.rl-peak{font-size:.68rem;color:var(--text-2)}
.rl-note{font-size:.8rem;color:var(--text-3);margin:.2rem 0 0;line-height:1.55}
.rl-note.empty{color:var(--text-2);font-style:italic}
.rl-more{font-size:.72rem;color:var(--text-2);margin:.6rem 0 0}

.foot{
  margin-top:1.6rem;text-align:center;
  font-size:.72rem;color:var(--text-3);
}

/* ---------------- 记录面板 ---------------- */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.66);
  display:flex;align-items:flex-end;justify-content:center;
  padding:0;
}
.overlay[hidden]{display:none}
@media (min-width:560px){
  .overlay{align-items:center;padding:1.5rem}
}

.sheet{
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  background:var(--card);
  border-radius:16px 16px 0 0;
  padding:1.1rem 1rem 1.2rem;
  border-top:1px solid var(--line);
  position:relative;
}
@media (min-width:560px){
  .sheet{border-radius:14px;border:1px solid var(--line)}
}
.sheet h2{font-size:1rem;font-weight:600;margin:0 0 .9rem;font-variant-numeric:tabular-nums;padding-right:2rem}
/* 手机上大家习惯右上角有个 ×，不能只靠 Esc 和点遮罩 */
.sheet-close{
  position:absolute;right:.5rem;top:.55rem;
  width:32px;height:32px;border-radius:8px;
  font:inherit;font-size:1.25rem;line-height:1;
  color:var(--text-3);background:transparent;border:0;cursor:pointer;
}
.sheet-close:hover{color:var(--accent);background:var(--card-2)}

.habits{display:flex;flex-direction:column;gap:.15rem}
.day-status{display:flex;gap:.4rem}
.day-status label{flex:1;cursor:pointer}
.day-status input{position:absolute;opacity:0}
.day-status span{display:block;text-align:center;padding:.45rem .3rem;border:1px solid var(--line);border-radius:8px;color:var(--text-2);font-size:.8rem}
.day-status input:checked + span{border-color:var(--accent);color:var(--text);background:var(--accent-dim)}
.day-status input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.habits.skipped{display:none}
.habit{
  position:relative;display:flex;align-items:center;gap:.7rem;
  padding:.72rem .6rem;border-radius:8px;cursor:pointer;
}
.habit:hover{background:var(--card-2)}
/* 视觉上藏起来但仍可聚焦；必须锚定在 label 上，否则会跑到别的定位父级去 */
.habit input{
  position:absolute;left:0;top:0;width:1px;height:1px;
  opacity:0;pointer-events:none;
}
.habit .box{
  width:22px;height:22px;flex:none;border-radius:6px;
  border:2px solid var(--text-3);background:transparent;
  position:relative;transition:background .12s,border-color .12s;
}
.habit input:checked + .box{background:var(--green);border-color:var(--green)}
.habit input:checked + .box::after{
  content:"";position:absolute;left:6.5px;top:2.5px;
  width:5px;height:11px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;
  transform:rotate(42deg);
}
.habit input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.habit .nm{font-size:.95rem}
.habit .hint{
  margin-left:auto;font-size:.7rem;color:var(--text-3);
  border:1px solid var(--line);border-radius:99px;padding:.05rem .45rem;
}
/* 面板里实时显示这条习惯当前的连续天数，勾的时候有反馈 */
.habit .hs{
  margin-left:auto;font-size:.7rem;color:var(--text-3);
  font-family:var(--mono);
}
.habit .hint + .hs{margin-left:.45rem}

.field-label{display:block;font-size:.74rem;color:var(--text-3);margin:.95rem 0 .35rem}
textarea{
  width:100%;min-height:5.5rem;resize:vertical;
  font:inherit;font-size:.92rem;line-height:1.6;
  color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;
  padding:.6rem .7rem;
}
textarea::placeholder{color:var(--text-3)}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}

.actions{display:flex;align-items:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.actions .spacer{flex:1}
.btn{
  font:inherit;font-size:.86rem;border-radius:8px;padding:.5rem .95rem;
  cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text-2);
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#0d1219;font-weight:600}
.btn.primary:hover{filter:brightness(1.1);color:#0d1219}
.btn.danger:hover{border-color:var(--red);color:#e08b88}
.btn.danger.arm{background:var(--red);border-color:var(--red);color:#fff}

.hintline{font-size:.68rem;color:var(--text-3);margin:.5rem 0 0;text-align:right}

/* ---------------- 习惯详情 ---------------- */
.detail-name{font-size:1rem;font-weight:600;margin:0 0 .2rem}
.detail-type{font-size:.72rem;color:var(--text-3);margin:0 0 .9rem}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem}
.detail-grid .stat{padding:.55rem .3rem}
.detail-grid .stat .v{font-size:1.05rem}
.detail-note{font-size:.74rem;color:var(--text-3);margin:.9rem 0 0}

/* ---------------- 提示条 ---------------- */
.toast{
  position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);
  z-index:80;max-width:min(92vw,460px);
  background:#f2f3f4;color:#121212;
  font-size:.82rem;padding:.5rem .95rem;border-radius:99px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);
}
.toast[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>

<body>

<div class="app">

  <header class="top">
    <div>
      <h1>每日坚持日历</h1>
      <a class="back" href="index.html">← 要搞清楚的事</a>
    </div>
    <div class="io">
      <button type="button" id="exportBtn">导出数据</button>
      <button type="button" id="importBtn">导入数据</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <!-- 视图切换。用 #stats 可以直接进统计那一页 -->
  <nav class="views" aria-label="视图切换">
    <button type="button" data-view="cal">日历</button>
    <button type="button" data-view="stats">统计</button>
  </nav>

  <nav class="skins" id="skins" aria-label="颜色风格"></nav>

  <div id="viewCal">

  <!-- 今日条：一眼看到今天记了没，并一键进入记录 -->
  <section class="today-bar" id="todayBar" aria-label="今天">
    <span class="tb-dot" aria-hidden="true"></span>
    <div class="tb-main">
      <div class="tb-title" id="todayTitle">今天</div>
      <div class="tb-sub" id="todaySub"></div>
    </div>
    <button type="button" class="btn primary" id="todayBtn">记录今天</button>
  </section>

  <section class="cal">
    <div class="cal-head">
      <button type="button" class="nav" id="prevBtn" aria-label="上个月">‹</button>
      <h2 id="calTitle"></h2>
      <button type="button" class="nav" id="nextBtn" aria-label="下个月">›</button>
    </div>
    <div class="weekdays" aria-hidden="true">
      <span>一</span><span>二</span><span>三</span><span>四</span>
      <span>五</span><span>六</span><span>日</span>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="legend">
    <span><i class="g"></i>全做到</span>
    <span><i class="y"></i>部分完成</span>
    <span><i class="r"></i>未完成无起飞</span>
    <span><i class="s"></i>休息跳过</span>
    <span><i class="n"></i>没记录</span>
  </div>

  <!-- 树：48 天长成一棵，长成后进功勋墙 -->
  <section class="grove" id="grove" aria-label="我的树"></section>

  </div><!-- /viewCal -->

  <div id="viewStats" hidden>

  <!-- 连续天数：跟在月历图例下面，不跟首屏的「今天 / 月历」抢位置 -->
  <section class="stats" id="stats" aria-label="连续天数"></section>

  <section class="monthly" id="monthly" aria-label="本月总结"></section>
  <section class="trend" id="trend" aria-label="近期趋势"></section>

  <!-- 起飞记录：把每次「起飞」的原因攒起来，看自己的扳机在哪 -->
  <section class="relapses" id="relapses" aria-label="起飞记录"></section>

  </div><!-- /viewStats -->

  <p class="foot">数据只存在这台设备的浏览器里 · 换设备前记得导出备份</p>
</div>

<!-- 记录面板 -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <button type="button" class="sheet-close" id="closeBtn" aria-label="关闭">×</button>
    <h2 id="sheetTitle"></h2>

    <label class="field-label">当天状态</label>
    <div class="day-status" role="radiogroup" aria-label="当天状态">
      <label><input type="radio" name="dayStatus" value="active" checked><span>正常记录</span></label>
      <label><input type="radio" name="dayStatus" value="skip"><span>休息跳过</span></label>
    </div>

    <div class="habits" id="habitList"></div>

    <label class="field-label" id="noteLabel" for="noteInput">今日备注</label>
    <textarea id="noteInput" placeholder="流水账、当日状态、感受…"></textarea>

    <div class="actions">
      <button type="button" class="btn danger" id="delBtn">删除当天记录</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancelBtn">取消</button>
      <button type="button" class="btn primary" id="saveBtn">保存</button>
    </div>
    <p class="hintline">Ctrl + Enter 保存</p>
  </div>
</div>

<!-- 习惯详情 -->
<div class="overlay" id="detailOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <button type="button" class="sheet-close" id="detailCloseBtn" aria-label="关闭">×</button>
    <h2 class="detail-name" id="detailName"></h2>
    <p class="detail-type" id="detailType"></p>
    <div class="detail-grid" id="detailGrid"></div>
    <p class="detail-note" id="detailNote"></p>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn primary" id="detailCloseBtn2">知道了</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

function emptyState(){
  return { habits: DEFAULT_HABITS.map(h => ({ ...h })), records: {}, trees: 0 };
}

const pad2 = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayKey = () => keyOf(new Date());

function parseKey(k){
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d);
}

/** 日期键是不是一个真实存在的日期（挡掉 2026-99-99、2026-02-30 这种）。 */
function isRealDate(k){
  if (!DATE_RE.test(k)) return false;
  const d = parseKey(k);
  return keyOf(d) === k;
}

/* ------------------------------------------------------------
   归一化：**加载存档和导入备份走同一条路**
   以前这两条路各写各的，导入进来的数据不再过一遍习惯对齐，
   结果导入一份旧备份就可能出现未知习惯、脏记录。
   ------------------------------------------------------------ */

/**
 * @param {any} raw          解析出来的对象（可能是垃圾）
 * @param {object} [opts]
 * @param {boolean} [opts.strict]  true = 用于导入备份：结构不对就抛 Error；
 *                                false = 用于读存档：结构不对就退回空状态
 * @returns {{habits:Array, records:object, repaired:string[]}} repaired 记录顺手修了哪些东西
 */
function normalizeState(raw, opts){
  const strict = !!(opts && opts.strict);
  const repaired = [];

  // 功勋墙上已有几棵。只增不减，所以这里只做「取个合法的非负整数」。
  const trees = (Number.isFinite(raw && raw.trees) && raw.trees > 0) ? Math.floor(raw.trees) : 0;

  const fail = msg => {
    if (strict) throw new Error(msg);
    return null;
  };

  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) fail('文件内容不是一个 JSON 对象');
  if (!Array.isArray(raw.habits) || raw.habits.length === 0) fail('缺少 habits 习惯列表');
  if (!raw.records || typeof raw.records !== 'object' || Array.isArray(raw.records)) fail('缺少 records 记录对象');

  // 习惯定义永远以代码为准（新增的补进来、改名的生效、小圆点顺序对齐）；
  // 存档里代码没有的习惯原样保留，免得把导入的自定义习惯吃掉。
  const known = new Set(DEFAULT_HABITS.map(d => d.id));
  const removed = new Set(['study', 'nocheat']);
  const extras = [];
  const seen = new Set(known);
  for (const h of raw.habits){
    if (!h || typeof h !== 'object') { if (strict) throw new Error('habits 里有条目的格式不对'); continue; }
    if (typeof h.id !== 'string' || !h.id) { if (strict) throw new Error('habits 里有条目缺少 id'); continue; }
    if (removed.has(h.id) || known.has(h.id) || seen.has(h.id)) continue;
    seen.add(h.id);
    const type = HABIT_TYPES.includes(h.type) ? h.type : 'good';
    if (type !== h.type) repaired.push(`习惯「${h.id}」的类型不认识，按「正向」处理`);
    extras.push({ id: h.id, name: typeof h.name === 'string' && h.name ? h.name : h.id, type });
  }
  const habits = DEFAULT_HABITS.map(d => ({ ...d })).concat(extras);
  const ids = new Set(habits.map(h => h.id));

  // 记录：丢掉坏日期、坏条目；把每条 habits 里的键归一到 true / false
  const records = {};
  let droppedDays = 0;
  for (const k of Object.keys(raw.records)){
    if (!isRealDate(k)){ droppedDays++; continue; }
    const r = raw.records[k];
    if (!r || typeof r !== 'object' || Array.isArray(r)){ droppedDays++; continue; }
    const src = (r.habits && typeof r.habits === 'object' && !Array.isArray(r.habits)) ? r.habits : {};
    const hs = {};
    for (const id of ids) hs[id] = src[id] === true;
    const dayStatus = r.dayStatus === DAY_STATUS.SKIP
      ? DAY_STATUS.SKIP
      : DAY_STATUS.ACTIVE;
    if (r.dayStatus !== undefined && r.dayStatus !== DAY_STATUS.ACTIVE && r.dayStatus !== DAY_STATUS.SKIP){
      repaired.push(`记录「${k}」的当天状态不认识，按正常记录处理`);
    }
    records[k] = {
      dayStatus,
      habits: hs,
      note: typeof r.note === 'string' ? r.note : ''
    };
  }
  if (droppedDays) repaired.push(`丢掉了 ${droppedDays} 天格式不对的记录`);

  if (strict && repaired.length) {
    // 导入时不静默修数据：先告诉用户会变成什么样，再由他决定
    // （这里只收集，不抛错 —— 调用方拿到 repaired 去弹确认）
  }

  return { habits, records, repaired, trees };
}

/** 读本地存储。任何异常一律退回空状态，绝不让页面白屏。 */
function loadState(){
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch(e){ return emptyState(); }
  if (!raw) return emptyState();

  try {
    const parsed = JSON.parse(raw);
    const norm = normalizeState(parsed, { strict:false });
    if (!norm) return emptyState();

    const out = { habits: norm.habits, records: norm.records, trees: norm.trees };

    // 归一化后跟存档不一致就立刻写回去，别让存档一直停在旧结构。
    // 这里不能调 saveState()：此刻模块级 state 还没赋值，会踩到 TDZ。
    if (JSON.stringify(parsed) !== JSON.stringify(out)){
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(out)); } catch(e){}
    }
    return out;
  } catch(e){
    return emptyState();
  }
}

let state = loadState();

function saveState(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  } catch(e){
    toast('保存失败：浏览器存储不可用');
    return false;
  }
}

/* ============================================================
   逻辑层 —— 状态判定、统计
   ============================================================ */

/**
 * 一天的完成状态。
 * 约定：habits[id] === true 一律表示「成功」——
 *   正向习惯 = 做到了；负向习惯 = 今天没有。
 *
 * 优先级：红 > 黄 > 绿。红色只表示「无起飞」未完成。
 */
function statusOf(key){
  const rec = state.records[key];
  if (!rec) return 'none';
  if (rec.dayStatus === DAY_STATUS.SKIP) return 'skip';
  const hs = rec.habits || {};

  const broke = state.habits.some(h => h.type === 'bad' && hs[h.id] !== true);
  if (broke) return 'fail';

  const allOk = state.habits.every(h => hs[h.id] === true);
  return allOk ? 'done' : 'partial';
}

const STATUS_TEXT = { none:'没有记录', done:'全部做到', partial:'部分完成', fail:'无起飞未完成', skip:'休息跳过' };

/** 一天里做到的项目数 / 总项目数。 */
function dayProgress(key){
  const rec = state.records[key];
  const total = state.habits.length;
  if (!rec) return { ok:0, total, ratio:null };
  const ok = state.habits.filter(h => rec.habits[h.id] === true).length;
  return { ok, total, ratio: total ? ok / total : null };
}

/**
 * 某个习惯的连续天数。
 * 从今天往前数，遇到「有记录但没做到」或「根本没记录」就停 —— 严格口径，不自欺。
 * 今天还没记录时从昨天起算（今天还没过完，不算断）。
 */
function streakOf(habitId){
  if (!state.habits.some(h => h.id === habitId)) return 0;

  const d = new Date();
  const todayRec = state.records[keyOf(d)];
  if (!todayRec || todayRec.dayStatus === DAY_STATUS.SKIP) d.setDate(d.getDate() - 1);

  let n = 0;
  while (n < 3650){
    const rec = state.records[keyOf(d)];
    if (!rec) break;
    if (rec.dayStatus === DAY_STATUS.SKIP){
      d.setDate(d.getDate() - 1);
      continue;
    }
    if (rec.habits[habitId] !== true) break;
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/** 某个习惯的历史最长连续天数。用来跟当前连续对比，看是不是在退步。 */
function longestStreakOf(habitId){
  const keys = Object.keys(state.records)
    .filter(k => state.records[k].dayStatus !== DAY_STATUS.SKIP && state.records[k].habits[habitId] === true)
    .sort();
  let best = 0, run = 0, prev = null;
  for (const k of keys){
    if (prev){
      const d = parseKey(prev);
      d.setDate(d.getDate() + 1);
      let next = keyOf(d);
      while (state.records[next] && state.records[next].dayStatus === DAY_STATUS.SKIP){
        d.setDate(d.getDate() + 1);
        next = keyOf(d);
      }
      run = next === k ? run + 1 : 1;
    } else {
      run = 1;
    }
    if (run > best) best = run;
    prev = k;
  }
  return best;
}

/* ---------------- 起飞记录 ---------------- */

/** 负向习惯（「无 X」那一类）。现在只有一个，但按列表写，以后加第二个不用改这儿。 */
const badHabits = () => state.habits.filter(h => h.type === 'bad');

/** 这天算不算「起飞了」：正常记录，但有负向习惯没做到。跳过日不算。 */
function lapsedOn(key){
  const rec = state.records[key];
  if (!rec || rec.dayStatus === DAY_STATUS.SKIP) return false;
  return badHabits().some(h => rec.habits[h.id] !== true);
}

function dayBefore(key){
  const d = parseKey(key);
  d.setDate(d.getDate() - 1);
  return keyOf(d);
}

/** 到 key 这天为止连了几天（含这天）。跳过日照旧跨过去。 */
function streakEndingAt(habitId, key){
  const d = parseKey(key);
  let n = 0;
  while (n < 3650){
    const rec = state.records[keyOf(d)];
    if (!rec) break;
    if (rec.dayStatus === DAY_STATUS.SKIP){ d.setDate(d.getDate() - 1); continue; }
    if (rec.habits[habitId] !== true) break;
    n++;
    d.setDate(d.getDate() - 1);
  }
  return n;
}

/**
 * 起飞记录：每次「起飞」的日期、破之前已经连了多少天、以及当时写下的原因。
 * 新的在前。原因攒多了就是一份自己的「扳机清单」——比「我又失败了」有用得多。
 */
function relapseLog(){
  return Object.keys(state.records)
    .filter(lapsedOn)
    .sort()
    .reverse()
    .map(k => {
      const before = dayBefore(k);
      return {
        key: k,
        note: (state.records[k].note || '').trim(),
        peak: badHabits().reduce((best, h) => Math.max(best, streakEndingAt(h.id, before)), 0),
      };
    });
}

/* ---------------- 树的生长 ---------------- */

/**
 * 这一天的净贡献。树**只看负向习惯**：
 *   守住了（没起飞） +1
 *   起飞了          −1
 *   休息跳过         0
 *   没记录           0
 *
 * 正向习惯（好好吃饭）不参与树的生长 —— 真正的目标是那个负向习惯，
 * 守住了就该有进展，不该因为另一条没做到而白干。
 */
function netOf(key){
  const rec = state.records[key];
  if (!rec || rec.dayStatus === DAY_STATUS.SKIP) return 0;
  return badHabits().some(h => rec.habits[h.id] !== true) ? -1 : 1;
}

function netTotal(){
  let n = 0;
  for (const k in state.records) n += netOf(k);
  return n;
}

/**
 * 当前这棵树长到哪了。
 * `done` 只增不减 —— 起飞不该把功勋墙上已经长成的树摘掉（挣来的东西不收回），
 * 它只让当前这棵往后退。所以 done 取「存档里记的」和「净天数算得出来的」里大的那个。
 */
function treeState(){
  const net = Math.max(0, netTotal());
  const done = Math.max(state.trees || 0, Math.floor(net / TREE_CYCLE));
  return {
    net,
    done,
    progress: Math.max(0, Math.min(TREE_CYCLE, net - done * TREE_CYCLE)),
  };
}

/** 刚长成新树就写进存档。返回有没有变化。 */
function syncTrees(){
  const done = treeState().done;
  if (done !== (state.trees || 0)){ state.trees = done; return true; }
  return false;
}

const treeStageOf = progress => Math.min(TREE_STAGES - 1, Math.floor(progress / DAYS_PER_STAGE));

/* 16 张图里每棵树实际有多高（画布 320px 为单位，量出来的）。
   用来把「按档跳」变成「按天长」——见 treeLook()。 */
const TREE_H = [28, 69, 102, 130, 133, 142, 157, 171, 179, 183, 194, 210, 212, 220, 230, 259];

/**
 * 每天显示哪张图、放多大。
 *
 * 规则：**一档用满 3 天**，档内的尺寸从这一档**几何插值**到下一档
 * （几何不是线性 —— 树是按比例长的，线性会让前期几乎不动）。
 *
 * 于是：图还是 3 天一换（形状跳跃可预期），但**尺寸天天在长**，
 * 而且换图那一刻尺寸正好接上（这一档的最后一天 = 下一档的第一天），
 * 所以只换形状、不跳大小。
 *
 * ⚠️ 试过另一种做法「让尺寸走一条统一的指数曲线、图取最接近的那张」——
 *    那样前 10 天会全停在第一张图上（因为素材里第 1→2 档差了 2.46 倍，
 *    统一曲线摊平之后要 10 天才追上），比不做还糟。
 */
function treeLook(progress){
  const p = Math.max(0, Math.min(TREE_CYCLE - 1, progress));
  const s = Math.min(TREE_STAGES - 1, Math.floor(p / DAYS_PER_STAGE));
  if (s >= TREE_STAGES - 1) return { stage: s, scale: 1 };
  const t = (p - s * DAYS_PER_STAGE) / DAYS_PER_STAGE;      // 这一档里走了几分之几
  const size = TREE_H[s] * Math.pow(TREE_H[s + 1] / TREE_H[s], t);
  return { stage: s, scale: size / TREE_H[s] };
}

const TREE_STAGE_NAMES = [
  '刚冒芽','冒出两片叶','小苗','开始抽枝','枝叶散开','小小一棵',
  '有了树形','枝头密起来','树冠成型','越长越开','像样了','枝繁叶茂',
  '树冠舒展','长得壮了','快长成了','长成了',
];

/** 某习惯在某月的完成情况，跳过日单独计数。 */
function habitMonthStats(habitId, y, m){
  const prefix = `${y}-${pad2(m+1)}-`;
  let days = 0, ok = 0, skipped = 0;
  for (const k in state.records){
    if (!k.startsWith(prefix)) continue;
    const rec = state.records[k];
    if (rec.dayStatus === DAY_STATUS.SKIP){ skipped++; continue; }
    days++;
    if (rec.habits[habitId] === true) ok++;
  }
  return { days, ok, skipped };
}

/** 该习惯最近一次「没做到」的日期键；跳过日不算没做到。 */
function lastMissOf(habitId){
  const d = new Date();
  const tk = keyOf(d);
  for (let i = 0; i < 3650; i++){
    const k = keyOf(d);
    if (k !== tk && state.records[k] && state.records[k].dayStatus !== DAY_STATUS.SKIP && state.records[k].habits[habitId] !== true) return k;
    d.setDate(d.getDate() - 1);
  }
  return null;
}

function monthStats(y, m){
  const prefix = `${y}-${pad2(m+1)}-`;
  let records = 0, skipped = 0, done = 0, fail = 0, partial = 0;
  for (const k in state.records){
    if (!k.startsWith(prefix)) continue;
    const st = statusOf(k);
    if (st === 'skip'){ skipped++; continue; }
    records++;
    if (st === 'done') done++;
    else if (st === 'fail') fail++;
    else partial++;
  }

  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const now = new Date();
  const isThisMonth = now.getFullYear() === y && now.getMonth() === m;
  const isFutureMonth = y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth());
  const lastDay = isFutureMonth ? 0 : (isThisMonth ? now.getDate() : daysInMonth);
  const missed = Math.max(0, lastDay - records - skipped);
  const perfect = done;

  return { records, activeDays:records, skipped, done, fail, partial, missed, perfect, lastDay };
}

function perfectDaysOf(y, m){
  return monthStats(y, m).perfect;
}

function monthTrend(y, m){
  const months = [];
  for (let offset = 2; offset >= 0; offset--){
    const d = new Date(y, m - offset, 1);
    const stats = monthStats(d.getFullYear(), d.getMonth());
    months.push({ y:d.getFullYear(), m:d.getMonth(), ...stats });
  }
  const current = months[2], previous = months[1];
  let summary = current.records < 5 ? '最近记录还不多' : '记录较稳定';
  if (previous.records >= 5 && current.records - previous.records >= 3) summary = `比上月多记 ${current.records - previous.records} 天`;
  else if (previous.records >= 5 && previous.records - current.records >= 3) summary = `比上月少记 ${previous.records - current.records} 天`;
  return { months, summary };
}

/* 踩到这些天数就值得说一句。想改就在这儿加/减。 */
const MILESTONES = [7, 14, 30, 60, 100, 200, 365];

/** 刚保存完，如果某个连续天数正好落在里程碑上，返回一句祝贺；否则 null。 */
function milestoneHit(){
  for (const id of STREAK_IDS){
    const h = state.habits.find(x => x.id === id);
    if (!h) continue;
    const n = streakOf(id);
    if (MILESTONES.includes(n)) return `🔥 「${h.name}」已经连续 ${n} 天`;
  }
  return null;
}

/** 保存完给的反馈：先说今天怎么样，再捎带里程碑。 */
function saveFeedback(key){
  const st = statusOf(key);
  const p = dayProgress(key);
  const miss = p.total - p.ok;

  let head;
  if (st === 'skip')         head = '已标记为休息跳过';
  else if (st === 'done')    head = `今天全部做到（${p.ok}/${p.total}）`;
  else if (st === 'fail')    head = `已记录：无起飞未完成（做到 ${p.ok}/${p.total}）`;
  else                       head = `已记录：${p.ok}/${p.total} 项，还差 ${miss} 项`;

  // 里程碑只捎带一句，不顶掉「今天怎么样」；跳过日本来就不该谈连续
  if (st === 'skip') return head;
  const mile = milestoneHit();
  return mile ? `${head} · ${mile}` : head;
}

function renderTodayBar(){

function renderCalendar(){
  const { y, m } = view;
  calTitle.textContent = `${y}年${m + 1}月`;

  const lead = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一 = 0
  const days = new Date(y, m + 1, 0).getDate();
  const tk = todayKey();

  grid.textContent = '';

  for (let i = 0; i < lead; i++){
    grid.appendChild(el('div', 'cell blank'));
  }

  for (let d = 1; d <= days; d++){
    const k = `${y}-${pad2(m+1)}-${pad2(d)}`;
    const st = statusOf(k);
    const isFuture = k > tk;

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `cell ${st}${k === tk ? ' today' : ''}${isFuture ? ' future' : ''}`;
    btn.dataset.date = k;
    btn.setAttribute('aria-label',
      `${y}年${m+1}月${d}日：${isFuture ? '还没到' : STATUS_TEXT[st]}`);

    btn.appendChild(el('span', null, String(d)));

    // 小圆点：按习惯顺序，实心 = 成功。只在有记录时显示。
    if (st !== 'none'){
      const rec = state.records[k];
      const dots = el('span', 'dots');
      state.habits.forEach(h => {
        const i = document.createElement('i');
        if (st !== 'skip' && rec.habits[h.id] === true) i.className = 'on';
        dots.appendChild(i);
      });
      btn.appendChild(dots);
    }

    if (!isFuture) btn.addEventListener('click', () => openSheet(k, btn));
    grid.appendChild(btn);
  }
}

/* ---------------- 树 ---------------- */
const GROVE_SLOTS = 6;       // 功勋墙先摆一行，长满了再补一行
let lastTreeStage = null;    // 上一次显示的是哪一档，用来判断这次是长了还是退了

function renderGrove(){
  const { progress, done } = treeState();
  const { stage, scale } = treeLook(progress);
  const box = $('grove');
  box.textContent = '';

  const head = el('div', 'grove-head');
  head.appendChild(el('h2', null, '我的树'));
  head.appendChild(el('span', 'grove-cycle', `第 ${done + 1} 棵`));
  box.appendChild(head);

  const art = el('div', 'grove-art');
  const img = document.createElement('img');
  img.src = TREE_IMG[stage] || '';
  img.alt = `第 ${progress} 天的树：${TREE_STAGE_NAMES[stage]}`;
  // 从树根往上缩放，补上「这一档的图」和「这一天该有的高度」之间的差额
  img.style.transform = 'scale(' + scale.toFixed(3) + ')';
  // 长一档 / 退一档给个半秒的动效 —— 那一下的变化本来就小，得帮它一把
  if (lastTreeStage !== null && stage !== lastTreeStage){
    img.className = stage > lastTreeStage ? 'grew' : 'shrank';
  }
  lastTreeStage = stage;
  art.appendChild(img);
  box.appendChild(art);

  const meta = el('div', 'grove-meta');
  meta.appendChild(el('span', 'gm-name', TREE_STAGE_NAMES[stage]));
  const day = el('span', 'gm-day');
  day.append(document.createTextNode(String(progress)), el('small', null, ` / ${TREE_CYCLE} 天`));
  meta.appendChild(day);
  box.appendChild(meta);

  const bar = el('div', 'grove-bar');
  const fill = document.createElement('i');
  fill.style.width = (progress / TREE_CYCLE * 100) + '%';
  bar.appendChild(fill);
  box.appendChild(bar);

  // 功勋墙
  const wall = el('div', 'grove-wall');
  const slots = Math.max(GROVE_SLOTS, Math.ceil((done + 1) / GROVE_SLOTS) * GROVE_SLOTS);
  for (let i = 0; i < slots; i++){
    const s = el('div', 'gw-slot' + (i >= done ? ' empty' : ''));
    if (i < done){
      const t = document.createElement('img');
      t.src = TREE_IMG[TREE_STAGES - 1] || '';
      t.alt = `第 ${i + 1} 棵长成的树`;
      // 16 张图是循环用的，墙上不微调就全是一个样。
      // 幅度压在小范围里 —— 试过调到蓝色，那就不像同一片林子了。
      // 这里只给「这一格自己的」微调，整体风格由 --tree-filter 叠在外面（见 .gw-slot img）。
      t.style.setProperty('--tw', ((i * 11) % 26 - 13) + 'deg');
      t.style.setProperty('--ts', (0.86 + (i % 4) * 0.09).toFixed(2));
      t.style.setProperty('--tb', (0.92 + (i % 3) * 0.06).toFixed(2));
      s.appendChild(t);
    }
    wall.appendChild(s);
  }
  box.appendChild(wall);

  const badNames = badHabits().map(h => '「' + h.name + '」').join('') || '负向习惯';
  box.appendChild(el('p', 'grove-note', done
    ? `已经长成 ${done} 棵。起飞只让现在这棵往后退，功勋墙上的不摘。`
    : `守住${badNames} +1、起飞 −1、休息跳过不增不减。${TREE_CYCLE} 天长成一棵。`));
}

function renderAll(){
  if (syncTrees()) saveState();
  renderTodayBar(); renderCalendar(); renderGrove(); renderStats();
  renderMonthly(); renderTrend(); renderRelapses();
}

/* ---------------- 记录面板 ---------------- */
let sheetDate = null;    // 当前编辑的日期键
let lastFocus = null;    // 关闭后焦点还回去

function openSheet(k, opener){
  sheetDate = k;
  lastFocus = opener || null;

  const d = parseKey(k);
  const wk = '日一二三四五六'[d.getDay()];
  const isToday = k === todayKey();
  sheetTitle.textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${wk}${isToday ? '（今天）' : ''}`;

  const rec = state.records[k];
  statusRadios.forEach(radio => { radio.checked = (rec ? rec.dayStatus : DAY_STATUS.ACTIVE) === radio.value; });

  habitList.textContent = '';
  state.habits.forEach(h => {
    const lab = el('label', 'habit');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.dataset.habit = h.id;
    cb.checked = !!(rec && rec.habits[h.id] === true);

    lab.append(cb, el('span', 'box'), el('span', 'nm', h.name));

    if (h.type === 'bad') lab.appendChild(el('span', 'hint', '不勾 = 未完成'));

    // 这条习惯当前连续几天 —— 勾的时候有即时反馈，比事后看统计更有推动力
    const n = streakOf(h.id);
    if (n > 0) lab.appendChild(el('span', 'hs', `连${n}天`));

    habitList.appendChild(lab);
  });

  syncDayStatus();

  noteInput.value = rec ? (rec.note || '') : '';
  delBtn.hidden = !rec;
  delBtn.classList.remove('arm');
  delBtn.textContent = '删除当天记录';

  overlay.hidden = false;
  document.body.classList.add('locked');

  const first = habitList.querySelector('input');
  if (first) first.focus();
}

function closeSheet(){
  overlay.hidden = true;
  document.body.classList.remove('locked');
  sheetDate = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

function saveSheet(){
  const k = sheetDate;
  if (!k) return;

  const hs = {};
  let anyChecked = false;
  habitList.querySelectorAll('input[type=checkbox]').forEach(cb => {
    hs[cb.dataset.habit] = cb.checked;
    if (cb.checked) anyChecked = true;
  });
  const note = noteInput.value.trim();
  const dayStatus = sheetStatus();

  if (dayStatus !== DAY_STATUS.SKIP && !anyChecked && !note){
    // 提示里的习惯名和条数都从数据里取，改了习惯不用回来改这里
    const badNames = state.habits.filter(h => h.type === 'bad').map(h => h.name).join(' / ');
    const what = `「${state.habits.length} 项全部未做到」（${badNames} = 未完成）`;
    const msg = state.records[k]
      ? `一条都没勾、备注也空着。这样会把这一天改成${what}。\n\n确定吗？`
      : `一条都没勾。这样会记成${what}。\n\n如果只是不想记这一天，点「取消」就好。确定要这样记吗？`;
    if (!confirm(msg)) return;
  }

  // 跳过日不看勾选：保留原来那份，免得切回「正常记录」时发现勾都没了
  const prev = state.records[k];
  const habits = (dayStatus === DAY_STATUS.SKIP && prev) ? prev.habits : hs;

  state.records[k] = { dayStatus, habits, note: note };
  if (saveState()){
    closeSheet();
    renderAll();
    toast(saveFeedback(k));
  }
}

function deleteSheet(){
  const k = sheetDate;
  if (!k || !state.records[k]) return;
  delete state.records[k];
  if (saveState()){
    closeSheet();
    renderAll();
    toast('已删除这一天的记录');
  }
}

/* ---------------- 习惯详情 ---------------- */
const detailOverlay = $('detailOverlay');
const statusRadios = [...document.querySelectorAll('input[name="dayStatus"]')];
let detailLastFocus = null;

/** 记录面板当前选的是「正常记录」还是「休息跳过」 */
function sheetStatus(){
  const r = document.querySelector('input[name="dayStatus"]:checked');
  return r ? r.value : DAY_STATUS.ACTIVE;
}

/** 选「休息跳过」就把习惯勾选收起来 —— 跳过日不该有「做到没做到」这回事 */
function syncDayStatus(){
  habitList.classList.toggle('skipped', sheetStatus() === DAY_STATUS.SKIP);
  syncNoteLabel();
}

/** 面板里是不是「正常记录 + 负向习惯没勾」——也就是这天起飞了 */
function isLapseInSheet(){
  if (sheetStatus() !== DAY_STATUS.ACTIVE) return false;
  return badHabits().some(h => {
    const cb = habitList.querySelector(`input[data-habit="${h.id}"]`);
    return cb && !cb.checked;
  });
}

/**
 * 起飞的日子，把「今日备注」改成「这次是因为什么」。
 * 平时备注写什么都行，只有这时候写下来的东西事后真的有用。
 */
function syncNoteLabel(){
  const lapse = isLapseInSheet();
  noteLabel.textContent = lapse ? '这次是因为什么' : '今日备注';
  noteInput.placeholder = lapse
    ? '例如：一个人在家 / 加班到很晚 / 刷手机刷到…'
    : '流水账、当日状态、感受…';
}

// 只绑一次。以前写在 openSheet 里，每开一次面板就多叠一层监听
statusRadios.forEach(radio => radio.addEventListener('change', syncDayStatus));
habitList.addEventListener('change', syncNoteLabel);

function openDetail(habitId){
  const h = state.habits.find(x => x.id === habitId);
  if (!h) return;

  detailLastFocus = document.activeElement;
  $('detailName').textContent = h.name;
  $('detailType').textContent = h.type === 'bad'
    ? '负向习惯 · 勾上 = 今天没有（不勾 = 未完成）'
    : '正向习惯 · 勾上 = 今天做到了';

  const cur = streakOf(h.id);
  const best = longestStreakOf(h.id);
  const ms = habitMonthStats(h.id, view.y, view.m);

  const grid = $('detailGrid');
  grid.textContent = '';
  [
    { v: cur, k:'当前连续天数', hot: cur >= 3 },
    { v: best, k:'最长连续天数' },
    { v: ms.ok, k:'本月做到' },
    { v: ms.days, k:'本月有效记录' },
    { v: ms.skipped, k:'本月跳过' },
  ].forEach(c => {
    const node = el('div', 'stat');
    const v = el('span', 'v');
    if (c.hot) v.appendChild(el('span', 'flame', '🔥'));
    v.appendChild(document.createTextNode(String(c.v)));
    node.append(v, el('span', 'k', c.k));
    grid.appendChild(node);
  });

  const miss = lastMissOf(h.id);
  $('detailNote').textContent = miss
    ? `最近一次没做到：${miss}`
    : '目前还没有「没做到」的记录。';

  detailOverlay.hidden = false;
}

function closeDetail(){
  detailOverlay.hidden = true;
  if (detailLastFocus && document.contains(detailLastFocus)) detailLastFocus.focus();
}

/* ---------------- 导入 / 导出 ---------------- */
function exportData(){
  const text = JSON.stringify(state, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `habit-backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('已导出备份文件');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try {
      parsed = JSON.parse(String(reader.result));
    } catch(e){
      toast('导入失败：文件不是合法的 JSON');
      return;
    }

    // 走跟读存档同一条归一化路径，只是这里「坏数据要报错」而不是静默兜底
    let norm;
    try {
      norm = normalizeState(parsed, { strict:true });
    } catch(err){
      toast('导入失败：' + err.message);
      return;
    }

    const n = Object.keys(norm.records).length;
    let msg =
      `即将导入 ${n} 天的记录（${norm.habits.length} 个习惯）。\n\n` +
      `⚠️ 这会覆盖当前的全部数据，且无法撤销。\n` +
      `当前有 ${Object.keys(state.records).length} 天记录。`;
    if (norm.repaired.length){
      msg += `\n\n备份里有几处会被自动修正：\n· ` + norm.repaired.join('\n· ');
    }
    msg += '\n\n确定继续吗？';
    if (!confirm(msg)) return;

    state = { habits: norm.habits, records: norm.records, trees: norm.trees };
    if (saveState()){
      closeSheet();
      closeDetail();
      view = { y: new Date().getFullYear(), m: new Date().getMonth() };
      renderAll();
      toast(`已导入 ${n} 天记录`);
    }
  };
  reader.onerror = () => toast('导入失败：读不了这个文件');
  reader.readAsText(file);
}

/* ============================================================
   事件绑定
   ============================================================ */
$('prevBtn').addEventListener('click', () => {
  view.m--;
  if (view.m < 0){ view.m = 11; view.y--; }
  renderAll();
});
$('nextBtn').addEventListener('click', () => {
  view.m++;
  if (view.m > 11){ view.m = 0; view.y++; }
  renderAll();
});

// 今日条：一键进今天的记录
$('todayBtn').addEventListener('click', e => {
  const tk = todayKey();
  // 今天那一格可能不在当前显示的月份里，先切过去，视觉上对得上
  const d = new Date();
  view = { y: d.getFullYear(), m: d.getMonth() };
  renderAll();
  const cell = grid.querySelector(`[data-date="${tk}"]`);
  openSheet(tk, cell || e.currentTarget);
});

$('saveBtn').addEventListener('click', saveSheet);
$('cancelBtn').addEventListener('click', closeSheet);
$('closeBtn').addEventListener('click', closeSheet);
$('detailCloseBtn').addEventListener('click', closeDetail);
$('detailCloseBtn2').addEventListener('click', closeDetail);

// 删除要二次确认：第一次点变成红色「确认删除」，4 秒内再点才真删
delBtn.addEventListener('click', () => {
  if (!delBtn.classList.contains('arm')){
    delBtn.classList.add('arm');
    delBtn.textContent = '确认删除？再点一次';
    setTimeout(() => {
      delBtn.classList.remove('arm');
      delBtn.textContent = '删除当天记录';
    }, 4000);
    return;
  }
  deleteSheet();
});

// 点遮罩关闭（点面板内部不关）
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
detailOverlay.addEventListener('click', e => { if (e.target === detailOverlay) closeDetail(); });

/** 焦点锁在弹窗里 —— 按 Tab 不该跑到背后那张日历上去。 */
function makeFocusTrap(box){
  box.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    // 视觉上隐藏但仍可聚焦的元素不该被 Tab 选中，这里统一用 :not([hidden])
    const items = [...box.querySelectorAll('button, textarea, input, [href]')]
      .filter(n => !n.hidden && n.offsetParent !== null);
    if (!items.length) return;
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  });
}
makeFocusTrap(overlay.querySelector('.sheet'));
makeFocusTrap(detailOverlay.querySelector('.sheet'));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!overlay.hidden) closeSheet();
    else if (!detailOverlay.hidden) closeDetail();
    return;
  }
  // Ctrl/Cmd + Enter 保存：写备注时不用把手从键盘上挪开
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !overlay.hidden){
    e.preventDefault();
    saveSheet();
  }
});

$('exportBtn').addEventListener('click', exportData);
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) importData(f);
  e.target.value = '';    // 允许连续导入同一个文件
});

/* ---------------- 视图切换 ---------------- */
/* 日历页：今天 + 月历 + 树。统计页：连续天数、月度总结、趋势、起飞记录。
   两页共用一份数据，所以「换页」不会丢东西。用 #stats 可以直接进统计页。 */
const viewBtns = [...document.querySelectorAll('.views button')];

function showView(name){
  const isStats = name === 'stats';
  $('viewCal').hidden = isStats;
  $('viewStats').hidden = !isStats;
  viewBtns.forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === name)));
}

const viewFromHash = () => (location.hash === '#stats' ? 'stats' : 'cal');

viewBtns.forEach(b => b.addEventListener('click', () => {
  const v = b.dataset.view;
  if (location.hash.slice(1) === v) showView(v);   // hash 没变就不会触发 hashchange
  else location.hash = v;
}));

// 前进/后退、手改地址栏、直接开 #stats 都走这一条
window.addEventListener('hashchange', () => showView(viewFromHash()));

/* ---------------- 颜色风格 ---------------- */
/* 树是位图，靠 CSS 滤镜换色，不重新出图 —— 所以加一套风格是几行配置，不是一次生成。
   ⚠️ 基准色不能写 'none'：.gw-slot img 那句是 var(--tree-filter) 后面还要接自己的微调，
      整条 filter 里出现 none 会让整句失效，功勋墙的差异化就没了。所以用 saturate(1) 当恒等。 */
const SKINS = [
  { id:'jade',   name:'青绿', sw:'#6fbf8f', leaf:'#6fbf8f', accent:'#7fa8dc', dim:'#22303f',
    tree:'saturate(1)' },
  { id:'moss',   name:'苔绿', sw:'#9dbb84', leaf:'#9dbb84', accent:'#9dbb84', dim:'#2b3324',
    tree:'hue-rotate(-16deg) saturate(.78) brightness(.94)' },
  { id:'autumn', name:'秋',   sw:'#d9a05b', leaf:'#d9a05b', accent:'#d9a05b', dim:'#3a2c1c',
    tree:'hue-rotate(-108deg) saturate(1.15) brightness(1.02)' },
  { id:'sakura', name:'樱',   sw:'#e08fb4', leaf:'#e08fb4', accent:'#e08fb4', dim:'#3a2430',
    tree:'hue-rotate(176deg) saturate(.78) brightness(1.1)' },
  { id:'frost',  name:'霜',   sw:'#8fc4d9', leaf:'#8fc4d9', accent:'#8fc4d9', dim:'#1e2f37',
    tree:'hue-rotate(52deg) saturate(.62) brightness(1.08)' },
];
const SKIN_KEY = 'habit-skin';
const skinsEl = $('skins');

function applySkin(id){
  const s = SKINS.find(x => x.id === id) || SKINS[0];
  const root = document.documentElement.style;
  root.setProperty('--tree-filter', s.tree);
  root.setProperty('--accent', s.accent);
  root.setProperty('--accent-dim', s.dim);
  root.setProperty('--leaf', s.leaf);
  [...skinsEl.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.skin === s.id)));
  try { localStorage.setItem(SKIN_KEY, s.id); } catch(e){}
}

SKINS.forEach(s => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.skin = s.id;
  b.title = s.name;
  b.setAttribute('aria-label', s.name);
  b.setAttribute('aria-pressed', 'false');
  b.style.setProperty('--sw', s.sw);
  b.appendChild(document.createElement('i'));
  b.addEventListener('click', () => applySkin(s.id));
  skinsEl.appendChild(b);
});

let savedSkin = SKINS[0].id;
try { savedSkin = localStorage.getItem(SKIN_KEY) || savedSkin; } catch(e){}
applySkin(savedSkin);

/* ---------------- 启动 ---------------- */
renderAll();
showView(viewFromHash());
</script>
